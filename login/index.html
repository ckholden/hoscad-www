<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HOSCAD — Client Access</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0d1117;
      --bg2:     #161b22;
      --bg3:     #1c2128;
      --border:  #30363d;
      --accent:  #4fa3e0;
      --accent2: #22c55e;
      --text:    #e6edf3;
      --muted:   #7d8590;
      --danger:  #f87171;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* NAV */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 48px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .nav-logo { display: flex; align-items: center; }
    .nav-logo img { height: 36px; width: auto; mix-blend-mode: screen; }
    .nav-back { font-size: 13px; color: var(--muted); }
    .nav-back:hover { color: var(--text); text-decoration: none; }

    /* MAIN */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
    }
    .card-eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .card h1 {
      font-size: 26px;
      font-weight: 900;
      margin-bottom: 8px;
    }
    .card p {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 32px;
      line-height: 1.6;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }
    .input-wrap { position: relative; }
    input[type="text"] {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      padding: 12px 16px;
      outline: none;
      transition: border-color .15s;
      letter-spacing: .04em;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"]::placeholder { color: var(--muted); letter-spacing: 0; }
    .input-hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
      margin-bottom: 24px;
    }

    .error-msg {
      font-size: 13px;
      color: var(--danger);
      margin-top: 8px;
      margin-bottom: 0;
      min-height: 20px;
    }

    .btn-go {
      display: block;
      width: 100%;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      font-size: 15px;
      padding: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 24px;
      font-family: inherit;
      letter-spacing: .02em;
      transition: background .15s;
    }
    .btn-go:hover { background: #5bb5f0; }

    .divider {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin: 28px 0 20px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    /* AGENCY QUICK-SELECT */
    .agency-list { display: flex; flex-direction: column; gap: 6px; }
    .agency-btn {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      padding: 10px 16px;
      text-align: left;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .agency-btn:hover { border-color: var(--accent); background: #1c2a38; }
    .agency-btn .slug { font-size: 11px; color: var(--muted); font-family: monospace; }

    .help-text {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      margin-top: 24px;
      line-height: 1.6;
    }

    @media (max-width: 500px) {
      nav { padding: 14px 20px; }
      .card { padding: 32px 24px; }
    }
  </style>
</head>
<body>
<nav>
  <div class="nav-logo">
    <a href="/"><img src="/logo.png" alt="HOSCAD" /></a>
  </div>
  <a href="/" class="nav-back">&#8592; Back to hoscad.net</a>
</nav>

<main>
  <div class="card">
    <div class="card-eyebrow">Client Access</div>
    <h1>Find Your Agency</h1>
    <p>Enter your agency ID to access your organization's HOSCAD portal.</p>

    <form id="agencyForm" onsubmit="goToAgency(event)">
      <label for="agencyInput">Agency ID</label>
      <div class="input-wrap">
        <input type="text" id="agencyInput" placeholder="e.g. scmc" autocomplete="off"
               autocorrect="off" autocapitalize="none" spellcheck="false" autofocus />
      </div>
      <div class="input-hint">Not case-sensitive. Contact your administrator if you're unsure.</div>
      <div class="error-msg" id="errorMsg"></div>
      <button type="submit" class="btn-go">Go to My Agency</button>
    </form>

    <div class="divider">or select your agency</div>

    <div class="agency-list" id="agencyList">
      <!-- populated by JS -->
    </div>

    <div class="help-text">
      Need help? Contact <a href="mailto:support@hoscad.net">support@hoscad.net</a>
    </div>
  </div>
</main>

<script>
// ── Known agencies ────────────────────────────────────────────────
// Add a new entry here when onboarding a new agency.
// id = subdomain slug (lowercase, no spaces)
// name = display name shown in the quick-select list
var AGENCIES = [
  { id: 'scmc', name: 'St. Charles Medical Center' },
];

// ── Build quick-select list ───────────────────────────────────────
(function buildList() {
  if (AGENCIES.length <= 1) return; // hide list if only one agency (type-in is faster)
  var list = document.getElementById('agencyList');
  AGENCIES.forEach(function(a) {
    var btn = document.createElement('button');
    btn.className = 'agency-btn';
    btn.type = 'button';
    btn.innerHTML = '<span>' + a.name + '</span><span class="slug">' + a.id + '</span>';
    btn.addEventListener('click', function() { redirect(a.id); });
    list.appendChild(btn);
  });
})();

// ── Lookup + redirect ─────────────────────────────────────────────
function goToAgency(e) {
  e.preventDefault();
  var raw = document.getElementById('agencyInput').value;
  var id  = raw.trim().toLowerCase().replace(/\s+/g, '');
  var err = document.getElementById('errorMsg');
  if (!id) { err.textContent = 'Please enter an agency ID.'; return; }
  var match = AGENCIES.find(function(a) { return a.id === id; });
  if (!match) {
    err.textContent = 'Agency ID "' + raw.trim() + '" not recognized. Check the ID and try again.';
    return;
  }
  err.textContent = '';
  redirect(id);
}

function redirect(id) {
  var proto = window.location.protocol;
  var host  = window.location.hostname; // e.g. hoscad.net
  // Replace the leading segment (or apex) with the agency subdomain
  // e.g. hoscad.net → scmc.hoscad.net
  var base  = host.replace(/^[^.]+\./, ''); // strip any existing subdomain
  if (!base.includes('.')) base = host;     // apex domain — use as-is for the root
  window.location.href = proto + '//' + id + '.' + base + '/home';
}
</script>
</body>
</html>
